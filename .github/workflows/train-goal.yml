name: Train goal model

on:
  schedule:
    - cron: "0 3 * * 1"      # kila Jumatatu 03:00 UTC (06:00 Dar es Salaam)
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q numpy huggingface_hub
      - name: Pakua rekodi na labels (dataset private)
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          try:
              snapshot_download(os.environ["DATA_REPO"], repo_type="dataset", token=os.environ["HF_TOKEN"], local_dir="audio_data")
          except Exception as e:
              print("ℹ️ Dataset bado haipo au haina data:", e)
          PY
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DATA_REPO: ${{ vars.GOAL_DATA_REPO || 'jaynesmaxtv/goal-audio' }}
      - name: Unganisha labels (za automatic kutoka Watch match + za mkono)
        id: labels
        run: |
          python - <<'PY'
          import csv, glob, os
          d = "audio_data/audio"
          rows, seen = [], set()
          for p in [f"{d}/labels.csv"] + sorted(glob.glob(f"{d}/labels/*.csv")):
              if not os.path.exists(p):
                  continue
              for r in csv.DictReader(open(p, encoding="utf-8")):
                  k = ((r.get("file") or "").strip(), str(r.get("sec") or "").strip(), (r.get("label") or "goal").strip())
                  if k[0] and k[1] and k not in seen and os.path.exists(f"{d}/{k[0]}"):
                      seen.add(k); rows.append(k)
          os.makedirs(d, exist_ok=True)
          with open(f"{d}/labels.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f); w.writerow(["file", "sec", "label"]); w.writerows(rows)
          goals = sum(1 for r in rows if r[2] != "near_miss")
          matches = len({r[0] for r in rows})
          ok = goals >= int(os.environ["MIN_GOALS"]) and matches >= int(os.environ["MIN_MATCHES"])
          print(f"labels: {len(rows)} | goals {goals} | mechi {matches} | tayari kufundisha: {ok}")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"ready={'1' if ok else '0'}\n")
          PY
        env:
          MIN_GOALS: ${{ vars.MIN_GOALS || '10' }}
          MIN_MATCHES: ${{ vars.MIN_MATCHES || '3' }}
      - name: Fundisha na pakia model
        if: steps.labels.outputs.ready == '1'
        run: python train_goal.py --upload
        env:
          AUDIO_DIR: audio_data/audio        # mp3 + labels.csv ziko kwenye folda ya audio/ ya dataset
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL_REPO: ${{ vars.GOAL_MODEL_REPO || 'jaynesmaxtv/goal-audio-model' }}
          
