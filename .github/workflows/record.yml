name: Record match audio

on:
  workflow_dispatch:
    inputs:
      url:     { description: "URL ya stream (m3u8 / mp3 / aac)", required: true }
      name:    { description: "Jina la mechi (mf. arsenal-chelsea)", required: true }
      minutes: { description: "Dakika za kurekodi", default: "105" }

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q huggingface_hub
      - run: python record.py
        env:
          URL: ${{ inputs.url }}
          NAME: ${{ inputs.name }}
          MINUTES: ${{ inputs.minutes }}
          AUTH: ${{ secrets.STREAM_AUTH }}      # hiari: 'Bearer ...' ikiwa stream inahitaji Authorization
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DATA_REPO: ${{ vars.GOAL_DATA_REPO || 'jaynesmaxtv/goal-audio' }}
