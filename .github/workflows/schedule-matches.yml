name: Schedule match watchers

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python schedule_matches.py
        env:
          CONTENT_URL: ${{ vars.CONTENT_URL || 'https://ooqvsqmsnwjqvuzbhczx.supabase.co' }}
          CONTENT_KEY: ${{ secrets.CONTENT_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          WATCH_DRY_RUN: ${{ vars.WATCH_DRY_RUN || 'true' }}   # weka 'false' (Variables) ukishahakikisha kila kitu ni sahihi
